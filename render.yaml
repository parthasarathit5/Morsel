# Foodiebay — Render deployment blueprint
# Deploy: push to GitHub → Render dashboard → New > Blueprint → select this repo.
#
# This blueprint creates ONE web service (foodiebay-api). The database is
# your existing Supabase PostgreSQL — paste its URL (with the @ in the
# password URL-encoded as %40) into the DATABASE_URL prompt during setup.

services:
  - type: web
    name: foodiebay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_data
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: '0'
      # Your Supabase Postgres (password @ encoded as %40):
      # postgresql://postgres:Supabase%40123@db.ndimnbxuteqcuzsyocht.supabase.co:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Comma separated: https://<your-firebase>.web.app etc.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Direct UPI collection (falls back to 7780383832@upi if unset)
      - key: UPI_VPA
        value: 7780383832@upi
      - key: UPI_PAYEE_NAME
        value: Foodiebay
